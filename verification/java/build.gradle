plugins {
    id 'java'
}
ext {
    jimmerVersion = '0.12.4'
}
repositories {
    mavenCentral()
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
dependencies {
    implementation "org.babyfish.jimmer:jimmer-sql:${jimmerVersion}"
    annotationProcessor "org.babyfish.jimmer:jimmer-apt:${jimmerVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'org.jetbrains:annotations:24.0.0'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    testImplementation 'org.antlr:antlr4-runtime:4.13.0'
    testImplementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
    testLogging { events "passed", "failed"; exceptionFormat "full"; showStandardStreams = true }
}

// Re-run the annotation processor when only .dto files change
tasks.named('compileJava') {
    inputs.files(fileTree('src/main/dto') { include '**/*.dto' })
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
