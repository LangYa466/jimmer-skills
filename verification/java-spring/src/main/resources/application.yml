spring:
  datasource:
    url: jdbc:h2:mem:spring;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
  sql:
    init:
      mode: always
jimmer:
  show-sql: true
  pretty-sql: true
  client:
    openapi:
      path: /openapi.yml
      ui-path: /openapi.html
      properties:
        info:
          title: Book Service
          version: 1.0
    ts:
      path: /ts.zip
