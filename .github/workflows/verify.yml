name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills against the Agent Skills specification
        run: |
          pip install skills-ref==0.1.1
          for dir in skills/*/; do agentskills validate "$dir"; done
      - name: Validate plugin manifests
        run: python3 -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"

  snippets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [java, java-spring, kotlin, kotlin-spring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Run snippet tests
        working-directory: verification/${{ matrix.project }}
        run: gradle test --no-daemon
